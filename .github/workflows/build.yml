name: Build and push image

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/backstage

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack (for the pinned Yarn version)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type-check
        run: yarn tsc

      # Produces packages/backend/dist/skeleton.tar.gz and bundle.tar.gz,
      # which packages/backend/Dockerfile copies into the image. Backstage's
      # backend build step must run on the host (same Node version as the
      # Dockerfile's FROM image), not inside the docker build itself.
      - name: Build the backend bundle
        run: yarn build:backend

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # NOTE: unlike milas-spell-and-tumble, the deploy chart for this app
      # lives in a different repo (paimonsoror/homelab-charts), so auto-pinning
      # the built tag there would need a cross-repo PAT. Bump
      # charts/argocd-apps/values.yaml manually for now after a build:
      #   image tag -> ${{ github.sha }} (short form also works, GHCR keeps both)
