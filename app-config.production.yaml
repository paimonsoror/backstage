app:
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  baseUrl: https://backstage.sororlab.dev

backend:
  # Note that the baseUrl should be the URL that the browser and other clients
  # should use when communicating with the backend, i.e. it needs to be
  # reachable not just from within the backend host, but from all of your
  # callers. When its value is "http://localhost:7007", it's strictly private
  # and can't be reached by others.
  baseUrl: https://backstage.sororlab.dev
  # listen.port is injected by the Helm chart via APP_CONFIG_backend_listen_port
  # (object form) -- a string form here conflicts with it at merge time.
  cors:
    origin: https://backstage.sororlab.dev

  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      # https://node-postgres.com/features/ssl
      # you can set the sslmode configuration option via the `PGSSLMODE` environment variable
      # see https://www.postgresql.org/docs/current/libpq-ssl.html Table 33.1. SSL Mode Descriptions (e.g. require)
      # ssl:
      #   ca: # if you have a CA file and want to verify it you can uncomment this section
      #     $file: <file-path>/ca/server.crt

catalog:
  locations:
    # Owner org data -- single-user homelab, needed for the OIDC sign-in resolver
    - type: file
      target: ./org.yaml
      rules:
        - allow: [User, Group]

    # Self-authored repos -- discovered via their catalog-info.yaml
    - type: url
      target: https://github.com/paimonsoror/homelab-charts/blob/main/catalog-info.yaml
    - type: url
      target: https://github.com/paimonsoror/technitium-dns/blob/main/catalog-info.yaml
    - type: url
      target: https://github.com/paimonsoror/milas-spell-and-tumble/blob/main/catalog-info.yaml

    # This Backstage instance itself
    - type: url
      target: https://github.com/paimonsoror/backstage/blob/main/catalog-info.yaml
